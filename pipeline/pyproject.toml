[project]
name = "four-lights-pipeline"
version = "0.1.0"
description = "Precompute for Four Lights: terrain horizons and Sun/Earth ephemerides for lunar south-pole sites"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "rasterio==1.5.2",
    "pyproj==3.8.0",
    "matplotlib==3.11.2",
    "spiceypy==8.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
